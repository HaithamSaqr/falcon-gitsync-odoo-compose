services:
  db:
    image: postgres:16
    platform: linux/amd64
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    restart: always
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: haithamsakr/odoo:saas-19.2-ce
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "11193:8069"
      - "21193:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
      - ./odoo-data:/var/lib/odoo
    restart: always
    entrypoint: /bin/bash
    command: /entrypoint.sh odoo -c /etc/odoo/odoo.conf